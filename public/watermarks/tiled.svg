<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aalm Vastralay Tiled Watermark">
  <defs>
    <pattern id="av-tiled" width="250" height="250" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <g opacity="0.10">
        <circle cx="60" cy="60" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" />
        <text x="60" y="70" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AV</text>
        <text x="60" y="105" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AALM VASTRALAY</text>
      </g>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#av-tiled)" />
</svg>
