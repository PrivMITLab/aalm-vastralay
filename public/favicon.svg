<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aalm Vastralay Vector Favicon">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d0e19" />
      <stop offset="50%" stop-color="#7a1f2b" />
      <stop offset="100%" stop-color="#9a2a45" />
    </linearGradient>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Royal Maroon Base Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#fav-bg)" />
  <!-- Imperial Gold Outer Solid Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#fav-gold)" stroke-width="12" />
  <!-- Imperial Gold Inner Filigree Dashed Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#fav-gold)" stroke-width="4" stroke-dasharray="14, 10" stroke-opacity="0.85" />
  <!-- Sacred Devanagari 'आ' Monogram (Aalm / आलम) -->
  <text x="256" y="348" font-family="'Noto Serif Devanagari', 'Mangal', 'Devanagari MT', 'Kokila', serif, Georgia" font-size="280" font-weight="900" fill="url(#fav-gold)" text-anchor="middle" filter="url(#glow)">आ</text>
</svg>
