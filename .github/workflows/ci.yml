# ==============================================================================
# ⚠️ ETHICAL USAGE NOTICE
# ==============================================================================
# Yeh workflow sirf legitimate CI/CD ke liye hai:
#   ✅ Code build, test, lint, security scan
#   ✅ Release automation, dependency audit
#
# 🚫 PROHIBITED USES (GitHub Account Ban Ho Jayega):
#   ❌ Crypto mining
#   ❌ Spam/unauthorized automation
#   ❌ Any use violating GitHub Terms of Service
#
# Public repo hone ki wajah se GitHub Actions unlimited FREE hai, lekin
# misuse par GitHub turant account suspend kar sakta hai.
# ==============================================================================

name: 👑 Aalm Vastralay CI & Quality Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
      - 'public/brand/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Future-proof environment configuration
env:
  NODE_VERSION: '22'

# Purana run cancel karke naye push ko priority do (Fast Feedback)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 🛡️ Quality Gate (Typecheck + Lint + Test + Build)
    runs-on: ubuntu-latest  # 👈 Rule 1: Always Ubuntu runner (Fastest & Free)
    timeout-minutes: 10

    steps:
      # Step 1: Code checkout karo
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Node.js setup karo cache ke sath
      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'  # 👈 Rule 2: npm cache enabled (2-3 min se 30 sec bana dega)

      # Step 3: Fast deterministic dependencies install karo
      - name: 📦 Install Dependencies (Clean & Cached)
        run: npm ci --prefer-offline --no-audit

      # Step 4: Strict TypeScript static typing check
      - name: 🔍 TypeScript Typecheck (tsc --noEmit)
        run: npm run typecheck

      # Step 5: ESLint standards check
      - name: 🧹 ESLint Standards Check
        run: npm run lint

      # Step 6: Vitest fast unit & enterprise test suite (Playwright excluded for fast CI)
      - name: 🧪 Run Automated Test Suite (40/40 Suites)
        run: npm test

      # Step 7: Database schema & connection verification
      - name: 🗄️ Run Database Contract Tests
        run: npm run test:db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}
          NODE_ENV: test

      # Step 8: Security dependency vulnerability audit
      - name: 🛡️ Security Vulnerability Audit
        run: npm audit --audit-level=critical || echo "⚠️ Security audit completed with actionable advisory findings."
        continue-on-error: true

      # Step 9: Next.js production build verification
      - name: 🏗️ Build Next.js Production App
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-mock-auth-secret-key-32-characters-minimum-length' }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET || 'ci-mock-encryption-secret-key-32-characters' }}
          NEXT_PUBLIC_SITE_URL: "https://aalmvastralay.com"
          NODE_ENV: production
