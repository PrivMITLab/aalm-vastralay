name: Deploy Architecture Showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'public/architecture.html'
      - '.archify/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'SudhirDevOps1/aalm-vastralay'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages Directory
        run: |
          mkdir -p _site
          cp public/architecture.html _site/index.html
          cp public/architecture.html _site/architecture.html
          if [ -d "public/logos" ]; then cp -r public/logos _site/; fi
          if [ -d "public/brand" ]; then cp -r public/brand _site/; fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
