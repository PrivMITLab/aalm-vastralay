name: Deploy Architecture Showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'public/architecture.html'
      - '.archify/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages Directory
        run: |
          mkdir -p _site
          cp public/architecture.html _site/index.html
          cp public/architecture.html _site/architecture.html
          if [ -d "public/logos" ]; then cp -r public/logos _site/; fi
          if [ -d "public/brand" ]; then cp -r public/brand _site/; fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
