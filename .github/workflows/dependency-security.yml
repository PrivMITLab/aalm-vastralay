name: Dependency Security & Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 22 * * *' # Har raat 3:30 AM IST (22:00 UTC) — Deep Nightly Dependency Audit
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: NPM Audit Check
    if: github.repository == 'SudhirDevOps1/aalm-vastralay'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Run NPM Audit
        run: |
          npm audit --audit-level=critical || echo "Audit completed with non-critical findings"
        continue-on-error: true
