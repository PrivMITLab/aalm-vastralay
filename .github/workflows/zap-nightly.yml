name: 🛡️ OWASP ZAP Nightly Security Pentest

on:
  schedule:
    - cron: '30 20 * * *' # Har raat 2:00 AM IST (20:30 UTC) — Deep Nightly Pentest
  workflow_dispatch:     # Manual trigger: Jab aapka mann kare Actions tab se 1-click scan run kar sakte hain

concurrency:
  group: zap-nightly-security-scan
  cancel-in-progress: true

jobs:
  zap-scan:
    name: OWASP ZAP Dynamic Security Pentest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Production App for Local Security Audit
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-mock-auth-secret-key-32-characters-minimum-length' }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET || 'ci-mock-encryption-secret-key-32-characters' }}
          NODE_ENV: production

      # Background me production server start karke scan karenge (Zero Vercel quota consumed)
      - name: Start Local Production Server in Background
        run: |
          nohup npm run start > /tmp/next.log 2>&1 &
          npx wait-on http://127.0.0.1:3000 --timeout 60000
          curl -I http://127.0.0.1:3000 || (cat /tmp/next.log && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-mock-auth-secret-key-32-characters-minimum-length' }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET || 'ci-mock-encryption-secret-key-32-characters' }}
          NODE_ENV: production

      # OWASP ZAP Baseline Scanner (100% Free DAST Security Scanner)
      - name: OWASP ZAP Baseline Security Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:3000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-m 2 -T 3 -P 8090"
          fail_action: false
