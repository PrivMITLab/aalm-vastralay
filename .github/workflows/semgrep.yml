name: 🛡️ Semgrep Static Security Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # SARIF upload → GitHub Security tab

jobs:
  semgrep:
    name: 🔍 Semgrep SAST Scan
    if: github.repository == 'SudhirDevOps1/aalm-vastralay'
    runs-on: ubuntu-latest  # 👈 Rule 1: Always Ubuntu runner
    timeout-minutes: 10
    container:
      image: semgrep/semgrep

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Run Semgrep — Custom Project Rules + OWASP Top 10
        run: |
          semgrep scan \
            --config=.semgrep.yml \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --sarif > /tmp/semgrep-results.sarif \
            || echo "⚠️ Semgrep found potential issues — check SARIF report in Security tab"
        continue-on-error: true

      - name: 📤 Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: /tmp/semgrep-results.sarif
          category: semgrep-sast
