name: 🛡️ Semgrep Static Security Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: 🔍 Semgrep SAST Scan
    runs-on: ubuntu-latest  # 👈 Rule 1: Always Ubuntu runner
    timeout-minutes: 10
    container:
      image: semgrep/semgrep

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Run Semgrep SAST Security Rules
        run: semgrep scan --config=auto
        continue-on-error: true
