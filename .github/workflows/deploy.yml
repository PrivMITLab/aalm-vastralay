name: Deploy Verification & Build (Manual / On-Demand)

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

concurrency:
  group: deploy-verification
  cancel-in-progress: true

jobs:
  deploy:
    name: 🏗️ Build & Smoke Verification
    if: github.repository == 'SudhirDevOps1/aalm-vastralay'
    runs-on: ubuntu-latest  # 👈 Rule 1: Always Ubuntu runner
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"  # 👈 Rule 2: Always enable npm cache

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🧪 Run Enterprise Tests
        run: npm test

      - name: 🏗️ Build Application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-mock-auth-secret-key-32-characters-minimum-length' }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET || 'ci-mock-encryption-secret-key-32-characters' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@aalmvastralay.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'AdminPassword123!' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://aalmvastralay.com' }}
          NODE_ENV: production
