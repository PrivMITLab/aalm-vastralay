# ==============================================================================
# 👑 AALM VASTRALAY (आलम वस्त्रालय) — AUTOMATED RELEASE MANAGEMENT SYSTEM
# File: .github/workflows/release.yml
# ==============================================================================
# YE WORKFLOW KYA KARTA HAI:
#   1. Har main push pe pehle Quality Gate chalata hai (Typecheck + Lint + Test + Build)
#   2. Agar code 100% green hai, tabhi Google's release-please check karta hai
#   3. Conventional Commits ke hisaab se automated Release PR banata hai
#   4. Jab aap PR merge karte hain, yeh Git tag, GitHub Release aur CHANGELOG.md banata hai
#   5. Version ko strictly 0.x.x range mein rakhta hai (jab tak aap manually 1.0.0 na bole)
#   6. Optional: Release hone par Vercel production redeploy trigger karta hai
#   7. Optional: Release hone par Discord/Slack webhook par alert bhejta hai
#   8. Faltu runs rokne ke liye paths-ignore lagaya hai (markdown/docs push pe nahi chalega)
# ==============================================================================

name: Release Please — Auto Version & Changelog

on:
  push:
    branches:
      - main
    # Faltu CI runs rokne ke liye: Sirf code change pe chalao, docs pe nahi
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - 'public/brand/**'
      - '.vscode/**'
      - '.idea/**'

  # Manual control: Jab aapka mann kare tab Actions tab se run kar sakte hain
  workflow_dispatch:
    inputs:
      release_as:
        description: 'Force specific version (jaise: 1.0.0 ya 0.2.0) [Optional]'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run test (bina actual release/PR banaye test karo)'
        required: false
        type: boolean
        default: false

# Ek time pe ek hi release run chalegi — race conditions aur tag conflicts zero
concurrency:
  group: release
  cancel-in-progress: false

# GitHub Actions permissions (native GITHUB_TOKEN ko write rights)
permissions:
  contents: write       # Git tag + GitHub Release publish karne ke liye
  pull-requests: write  # Release PR banane aur label karne ke liye
  issues: write         # PR issues aur comments ke liye

jobs:
  # ============================================================================
  # JOB 1: QUALITY GATE (Release se pehle strict verification)
  # Agar build ya test fail hua, toh release kabhi nahi banegi (Zero-Defect Law)
  # ============================================================================
  quality-gate:
    name: 🛡️ Strict Quality Gate (Typecheck + Lint + Test + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Clean Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: 🧹 ESLint Code Quality Inspection
        run: npm run lint

      - name: 🧪 Automated Enterprise Tests (38/38 Suites)
        run: npm test

      - name: 🏗️ Production Next.js Build Verification
        env:
          # Build-time fail-safe environment variables (zero network failure during static generation)
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://aalm_build_user:mock_pass@ep-empty.ap-southeast-1.aws.neon.tech/neondb?sslmode=require' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'aalm_vastralay_production_fail_safe_auth_secret_build_time_token_32_bytes' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://aalmvastralay.com' }}
          NEXT_PUBLIC_B2_WORKER_URL: 'https://b2-proxy.marketplace.workers.dev'
          NEXT_PHASE: 'phase-production-build'
        run: npm run build

  # ============================================================================
  # JOB 2: RELEASE PLEASE (Google's Automated Versioning Engine)
  # Sirf tab chalega jab JOB 1 (Quality Gate) 100% green pass hoga
  # ============================================================================
  release-please:
    name: 🚀 Auto Release & Version Bump
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - name: 🤖 Run Google Release Please Engine
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Configuration file (0.x.x pre-major rules + emojis)
          config-file: release-please-config.json
          # Manifest file (current version tracking)
          manifest-file: .release-please-manifest.json
          # Native repository GITHUB_TOKEN (Read and write permissions enabled in repo settings)
          token: ${{ secrets.GITHUB_TOKEN }}
          # Manual release-as input support (jaise: 1.0.0 manual trigger)
          release-as: ${{ github.event.inputs.release_as }}

  # ============================================================================
  # JOB 3: TRIGGER VERCEL DEPLOY (Optional Post-Release Deployment)
  # Sirf tab chalega jab actual release create hua ho AUR secret configure ho
  # ============================================================================
  trigger-vercel-deploy:
    name: 🌐 Trigger Vercel Production Deploy
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created && secrets.VERCEL_DEPLOY_HOOK != '' }}

    steps:
      - name: 🚀 Call Vercel Deploy Hook via Curl
        run: |
          echo "Triggering Vercel deployment for new release: ${{ needs.release-please.outputs.tag_name }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Vercel deploy hook triggered successfully (HTTP $HTTP_STATUS)!"
          else
            echo "⚠️ Vercel deploy hook returned HTTP $HTTP_STATUS"
          fi

  # ============================================================================
  # JOB 4: TEAM NOTIFICATIONS (Discord / Slack Webhook Alerts)
  # Sirf tab chalega jab actual release create hua ho AUR webhook configured ho
  # ============================================================================
  notify:
    name: 📢 Send Release Notification
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created && (secrets.DISCORD_WEBHOOK != '' || secrets.SLACK_WEBHOOK != '') }}

    steps:
      # Discord Webhook Notification
      - name: 💬 Send Discord Release Embed
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${{ needs.release-please.outputs.version }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [{
                   \"title\": \"🎉 New Release: ${TAG}\",
                   \"url\": \"${RELEASE_URL}\",
                   \"color\": 15258703,
                   \"description\": \"**Aalm Vastralay** version **${VERSION}** has been published successfully!\",
                   \"fields\": [
                     { \"name\": \"📦 Version\", \"value\": \"\`${VERSION}\`\", \"inline\": true },
                     { \"name\": \"🏷️ Git Tag\", \"value\": \"\`${TAG}\`\", \"inline\": true },
                     { \"name\": \"📜 Changelog\", \"value\": \"[View Notes](${RELEASE_URL})\", \"inline\": true }
                   ],
                   \"footer\": { \"text\": \"Aalm Vastralay DevOps • Release Automation\" }
                 }]
               }" \
               "${{ secrets.DISCORD_WEBHOOK }}"

      # Slack Webhook Notification
      - name: 💬 Send Slack Release Message
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${{ needs.release-please.outputs.version }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          
          curl -X POST -H 'Content-type: application/json' \
               --data "{
                 \"text\": \"🎉 *Aalm Vastralay New Release: <${RELEASE_URL}|${TAG}>* (Version \`${VERSION}\`)\"
               }" \
               "${{ secrets.SLACK_WEBHOOK }}"

  # ============================================================================
  # JOB 5: GITHUB STEP SUMMARY (Actions UI par beautiful status report)
  # ============================================================================
  summary:
    name: 📋 Generate GitHub Release Summary
    needs: [quality-gate, release-please]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📝 Write Beautiful Step Summary
        run: |
          echo "## 👑 Aalm Vastralay — Release Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Quality Gate** | ${{ needs.quality-gate.result == 'success' && '✅ Passed' || '❌ Failed' }} | Typecheck, Lint, 38 Test Suites, Next.js Build |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            echo "| 🚀 **Release Status** | 🎉 **NEW RELEASE PUBLISHED** | Tag: \`${{ needs.release-please.outputs.tag_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 **Version** | \`${{ needs.release-please.outputs.version }}\` | Auto-bumped via Conventional Commits |" >> $GITHUB_STEP_SUMMARY
            echo "| 📜 **Changelog** | ✅ Updated | [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🚀 **Release Status** | ℹ️ PR Waiting / Up-to-date | Release PR updated or no release-triggering commits |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Note**: Versions are locked in \`0.x.x\` until manual \`1.0.0\` launch. All checks follow project \`docs/RULES.md\`." >> $GITHUB_STEP_SUMMARY
